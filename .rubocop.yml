plugins:
  - rubocop-factory_bot
  - rubocop-performance
  - rubocop-rails
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  Exclude:
    - "bin/**/*"
    - "db/schema.rb"
    - "vendor/**/*"

Metrics/AbcSize:
  Max: 20
  CountRepeatedAttributes: false
  Exclude:
    - "spec/support/*"

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Enabled: false

RSpec/MultipleExpectations:
  Enabled: false

RSpec/ExampleLength:
  Enabled: false

RSpec/MultipleMemoizedHelpers:
  Max: 10

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  EnforcedStyle: double_quotes

# Constraint specs must write past model validations to prove the DB CHECKs, and seeds load fixed rows by id.
# Production code keeps the cop: every bypass there needs an inline disable backed by a decision record.
Rails/SkipsModelValidations:
  Exclude:
    - "spec/**/*"
    - "db/seeds.rb"

Layout/MultilineMethodArgumentLineBreaks:
  Enabled: true

Layout/MultilineHashKeyLineBreaks:
  Enabled: true
